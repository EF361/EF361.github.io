<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6cf6d5" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Background Badge -->
  <rect width="64" height="64" rx="16" fill="#080a12" stroke="rgba(108, 246, 213, 0.25)" stroke-width="2" />

  <!-- Hexagon Tech Icon -->
  <g transform="translate(7, 7)">
    <polygon points="25,2 45,13.5 45,36.5 25,48 5,36.5 5,13.5" fill="none" stroke="url(#favDarkGrad)" stroke-width="2.5" filter="url(#favGlow)" />
    <path d="M16 34 L25 16 L34 34" fill="none" stroke="#6cf6d5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M19 28 L31 28" fill="none" stroke="#6cf6d5" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="25" cy="16" r="2.5" fill="#6cf6d5" />
    <circle cx="16" cy="34" r="2.5" fill="#10b981" />
    <circle cx="34" cy="34" r="2.5" fill="#10b981" />
    <path d="M31 28 C 36 28, 36 34, 30 35 L 26 35" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
